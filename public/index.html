<style>
:root {
  --bg: #F1F5F3;
  --panel: #FFFFFF;
  --panel2: #E8EFEA;
  --ink: #0F172A;
  --muted: #596E63;
  --line: #D0DBD3;
  --helm: #10B981;
  --helm-ink: #FFFFFF;
  --ok: #10B981;
  --bad: #E11D48;
  --info: #0284C7;
  --warning: #F59E0B;
  --hero: #0F172A;
  --hero-ink: #F8FAFC;
  --hero-muted: #94A3B8;
  --tick: rgba(15, 23, 42, 0.35);
  --tick2: rgba(15, 23, 42, 0.15);
  --glass: rgba(241, 245, 243, 0.78);
  --glass-strong: rgba(255, 255, 255, 0.88);
  --glass-line: rgba(15, 23, 42, 0.08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090E11;
    --panel: #11181D;
    --panel2: #182228;
    --ink: #EDF3F7;
    --muted: #8296A4;
    --line: #22313A;
    --helm: #10B981;
    --helm-ink: #032117;
    --ok: #10B981;
    --bad: #F43F5E;
    --info: #38BDF8;
    --warning: #FBBF24;
    --hero: #11181D;
    --hero-ink: #F8FAFC;
    --hero-muted: #8FA2B0;
    --tick: rgba(237, 243, 247, 0.28);
    --tick2: rgba(237, 243, 247, 0.14);
    --glass: rgba(9, 14, 17, 0.78);
    --glass-strong: rgba(17, 24, 29, 0.90);
    --glass-line: rgba(237, 243, 247, 0.08);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #090E11;
  --panel: #11181D;
  --panel2: #182228;
  --ink: #EDF3F7;
  --muted: #8296A4;
  --line: #22313A;
  --helm: #10B981;
  --helm-ink: #032117;
  --ok: #10B981;
  --bad: #F43F5E;
  --info: #38BDF8;
  --warning: #FBBF24;
  --hero: #11181D;
  --hero-ink: #F8FAFC;
  --hero-muted: #8FA2B0;
  --tick: rgba(237, 243, 247, 0.28);
  --tick2: rgba(237, 243, 247, 0.14);
  --glass: rgba(9, 14, 17, 0.78);
  --glass-strong: rgba(17, 24, 29, 0.90);
  --glass-line: rgba(237, 243, 247, 0.08);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Archivo, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}

.num { font-variant-numeric: tabular-nums; font-stretch: 110%; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }

h1, h2, h3 { margin: 0; line-height: 1.15; }
h2 { font-size: 21px; font-weight: 800; font-stretch: 112%; }
h3 { font-size: 16px; font-weight: 750; }

/* Sticky Top Header (iOS Premium Responsive) */
header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 25;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  margin: 0 -16px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--glass-line);
}

.top-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
}

.top-mobile-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}

.top-brand-logo {
  display: none;
  align-items: center;
  gap: 6px;
  font-weight: 850;
  font-size: 16px;
  letter-spacing: -0.2px;
  color: var(--ink);
  user-select: none;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.projbtn {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: none;
  border: 0;
  padding: 2px 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}

.proj-head {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.proj-head b {
  display: block;
  font-size: 15.5px;
  font-weight: 800;
  font-stretch: 112%;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  color: var(--ink);
}

.proj-chevron {
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
  flex-shrink: 0;
}

.projbtn span {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

/* Mobile Layout (< 520px): Clean 2-Tier Stack, No Collision Ever */
@media (max-width: 520px) {
  header.top {
    padding: 7px 14px 8px;
  }
  .top-inner {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .top-mobile-bar {
    width: 100%;
  }
  .top-brand-logo {
    display: inline-flex;
  }
  .top-inner .projbtn {
    width: 100%;
    padding: 5px 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .top-inner .proj-head b {
    font-size: 13.5px;
  }
  .top-inner .projbtn span {
    font-size: 11px;
  }
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 650;
  background: var(--panel2);
  border: 1px solid var(--line);
  white-space: nowrap;
  cursor: pointer;
}
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--bad); }
.pill.info { color: var(--info); }
.pill.warning { color: var(--warning); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Fixed Bottom Nav Dock */
nav.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--glass-line);
  z-index: 30;
  display: flex;
  justify-content: center;
}
nav.bottom .in {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  max-width: 560px;
  width: 100%;
}
nav.bottom button {
  min-height: 58px;
  background: none;
  border: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: color 0.15s ease;
}
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--ink); font-weight: 800; }
nav.bottom button[aria-current="page"] svg { color: var(--helm); }
nav.bottom button[aria-current="page"]::after {
  content: "";
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--helm);
  margin-top: 1px;
}

.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 > * { min-width: 0; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.card .lab { font-size: 13px; color: var(--muted); font-weight: 650; }
.card .val {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: clamp(18px, 5.2vw, 22px);
  font-weight: 800;
  font-stretch: 112%;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  line-height: 1.15;
}
.card .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
button.card { text-align: left; cursor: pointer; width: 100%; }

/* Hero Card */
.hero {
  background: var(--hero);
  color: var(--hero-ink);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
}
.hero .lab { color: var(--hero-muted); font-size: 13.5px; font-weight: 650; }
.hero .big {
  font-size: clamp(32px, 9vw, 44px);
  font-weight: 800;
  color: var(--helm);
  font-stretch: 115%;
  letter-spacing: -0.01em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  margin: 4px 0 2px;
  white-space: nowrap;
  overflow: hidden;
}
.hero .big .cur { font-size: 0.55em; font-weight: 700; margin-right: 0.12em; vertical-align: 0.45em; opacity: 0.9; }
.hero .words { font-size: 12.5px; color: var(--hero-muted); margin-bottom: 12px; min-height: 1.1em; }
.hero .flow {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  padding-top: 12px;
}
.hero .flow div { font-size: 12px; color: var(--hero-muted); }
.hero .flow b {
  display: block;
  color: var(--hero-ink);
  font-size: 12.5px;
  font-stretch: 95%;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

/* Progress bar ruler */
.ruler {
  position: relative;
  height: 14px;
  border-radius: 4px;
  background: var(--panel2);
  overflow: hidden;
  border: 1px solid var(--line);
  margin-top: 8px;
}
.ruler i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--helm); border-radius: 3px; }

/* Filter chips horizontal scroll */
.fchips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.fchips::-webkit-scrollbar { display: none; }
.fchip {
  flex: none;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-weight: 650;
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.fchip[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: transparent;
}

/* 2x2 Quick Action Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  min-height: 86px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.tile:active { transform: scale(0.98); }
.tile b { font-size: 15.5px; font-weight: 750; color: var(--ink); }
.tile span { font-size: 12.5px; color: var(--muted); }

/* Clean List Rows (Zero off-grid table!) */
.card.list { padding: 0 14px; }
.list .it {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--line);
  background: none;
  border-left: 0;
  border-right: 0;
  border-top: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  min-height: 56px;
}
.list .it:last-child { border-bottom: 0; }
.list .it .avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  flex: none;
}
/* iOS Premium Avatar & Badges */
.ios-avatar {
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
  user-select: none;
}
.ios-avatar:hover {
  transform: scale(1.02);
}
.ios-avatar-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  background: var(--helm);
  color: #fff;
  border: 2.5px solid var(--panel2);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  transition: transform 0.15s ease;
  padding: 0;
}
.ios-avatar-badge:hover {
  transform: scale(1.12);
}
.list .it .t { flex: 1; min-width: 0; }
.list .it .t b {
  display: block;
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list .it .t span {
  font-size: 12.5px;
  color: var(--muted);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list .it .r { text-align: right; flex: none; }
.list .it .r b { display: block; font-size: 15px; font-weight: 750; }
.list .it .r span { font-size: 12px; color: var(--muted); }

.dayhd { font-size: 13px; font-weight: 750; color: var(--muted); padding: 14px 2px 4px; text-transform: uppercase; letter-spacing: 0.04em; }

/* Buttons */
.btn {
  min-height: 46px;
  border-radius: 12px;
  padding: 0 16px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14.5px;
}
.btn.pri { background: var(--helm); color: var(--helm-ink); border-color: transparent; }
.btn.ink { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.bad { color: var(--bad); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.iconbtn {
  min-width: 40px;
  min-height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  font-size: 18px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
}
.link { background: none; border: 0; color: var(--info); font-weight: 650; cursor: pointer; padding: 6px 0; }

/* Forms & Fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 650; color: var(--muted); }
.field input, .field select, .field textarea {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  padding: 10px 12px;
  width: 100%;
  font-size: 14.5px;
}
.field textarea { min-height: 80px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); font-size: 13.5px; font-weight: 650; min-height: 1.1em; }

/* Sheet Drawer Modal */
.sheet-bg {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 12, 0.45);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  z-index: 40;
  display: none;
}
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  display: none;
  justify-content: center;
}
.sheet .box {
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border-top: 1px solid var(--glass-line);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
}
.sheet.open, .sheet-bg.open { display: flex; }
.sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet.open .box { animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

/* Activity Feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li {
  display: flex;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  align-items: baseline;
}
.feed li:last-child { border-bottom: 0; }
.feed .d { width: 72px; flex: none; color: var(--muted); font-size: 12.5px; }
.feed .t { flex: 1; min-width: 0; }
.feed .a { font-variant-numeric: tabular-nums; font-weight: 750; white-space: nowrap; }
.in-c { color: var(--ok); }
.out-c { color: var(--ink); }
.void { text-decoration: line-through; opacity: 0.5; }

/* Toast */
.toast {
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: calc(14px + env(safe-area-inset-top, 0px));
  background: var(--ink);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 650;
  z-index: 50;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  display: none;
  max-width: calc(100% - 32px);
  white-space: nowrap;
}
.toast.show { display: block; }

/* Footer Watermark (Mandatory Link to zandev.id) */
.credit {
  text-align: center;
  font-size: 12.5px;
  color: var(--muted);
  padding: 28px 0 12px;
}
.credit a {
  color: var(--ink);
  text-decoration: none;
  font-weight: 750;
  transition: color 0.15s ease;
}
.credit a:hover { color: var(--helm); text-decoration: underline; }

/* Splash Screen (Frameless Native iOS Experience) */
#splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
  pointer-events: auto;
  user-select: none;
  -webkit-user-select: none;
}
#splash.hide {
  opacity: 0;
  transform: scale(1.04);
  visibility: hidden;
  pointer-events: none;
}
.splash-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  max-width: 320px;
  width: 100%;
}
.splash-logo {
  width: clamp(140px, 42vw, 190px);
  height: auto;
  display: block;
  margin: 0 auto;
  border: none !important;
  background: transparent !important;
  box-shadow: none !important;
  animation: splashPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.splash-logo .st-orbit { fill: #606060; }
.splash-logo .st-green { fill: #10b981; }
.splash-logo .st-ink { fill: var(--ink); }

@keyframes splashPop {
  0% {
    opacity: 0;
    transform: scale(0.86) translateY(12px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.splash-bar {
  width: 120px;
  height: 3px;
  background: var(--tick2);
  border-radius: 999px;
  margin-top: 26px;
  overflow: hidden;
  position: relative;
}
.splash-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--helm);
  border-radius: 999px;
  animation: splashLoad 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}
@keyframes splashLoad {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(20%); }
  100% { transform: translateX(110%); }
}

.splash-sub {
  font-size: 11.5px;
  font-weight: 650;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 14px;
  animation: splashFadeIn 0.8s ease 0.25s forwards;
  opacity: 0;
}
@keyframes splashFadeIn {
  to { opacity: 1; }
}

.splash-foot {
  position: absolute;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  font-size: 11.5px;
  color: var(--muted);
}
.splash-foot a {
  color: inherit;
  text-decoration: none;
}
.splash-foot a b {
  color: var(--helm);
}

/* Printable Kuitansi / Slip LPJ */
@media print {
  body { background: #fff !important; color: #000 !important; }
  header.top, nav.bottom, .credit, .sheet-bg, .no-print { display: none !important; }
  .sheet { position: static !important; display: block !important; }
  .sheet .box { max-height: none !important; border: 0 !important; background: #fff !important; padding: 0 !important; }
  .print-slip { border: 2px solid #000 !important; padding: 24px !important; margin: 10px 0 !important; }
}
</style>

function loadState() {
  let loaded = false;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      S = JSON.parse(raw);
      loaded = true;
    }
  } catch (e) {
    console.error('Failed to load local state', e);
  }

  // If v3 does not exist or empty, purge legacy dirty dummy cache & initialize with authentic RAB seed
  if (!loaded || !S || !S.projects || !S.projects.length) {
    try {
      localStorage.removeItem('zanfin_state_v2');
      localStorage.removeItem('zanfin_state_v1');
      localStorage.removeItem('zanfin_state');
    } catch (_) {}
    S = defaultSeed();
    saveState();
  }

  // Deep sanitization guarantees 100% clean data free of fictional names or wrong academic titles
  sanitizeAllData();
}

function sanitizeAllData() {
  if (!S) return;
  let migrated = false;

  const REAL_LEADER = 'Dr. Siti Rahayu Nadhiroh, S.KM., M.Kes.';
  const FAKE_TITLE_SNIPPETS = ['Dr. Ir. Hj.', 'Ir. Hj.', 'Dr. Ir. Hj. Nadhiroh', 'Nadhiroh, M.Kes'];
  const FAKE_PEOPLE = ['Nurhaliza', 'Budi Santoso', 'Ahmad Zaki'];

  // 1. Projects Sanitization
  if (S.projects) {
    for (const p of S.projects) {
      if (p.leader && (FAKE_TITLE_SNIPPETS.some(f => p.leader.includes(f)) || !p.leader.includes('Siti Rahayu'))) {
        p.leader = REAL_LEADER;
        migrated = true;
      }
      if (p.holder && (FAKE_TITLE_SNIPPETS.some(f => p.holder.includes(f)) || !p.holder.includes('Siti Rahayu'))) {
        p.holder = REAL_LEADER;
        migrated = true;
      }
    }
  }

  // 2. Workers Sanitization (Remove fictional dummy workers)
  if (S.workers) {
    const origW = S.workers.length;
    S.workers = S.workers.filter(w => !FAKE_PEOPLE.some(fp => (w.name || '').includes(fp)));
    if (S.workers.length !== origW) migrated = true;

    for (const w of S.workers) {
      if (w.name && (FAKE_TITLE_SNIPPETS.some(f => w.name.includes(f)) || (w.name.includes('Nadhiroh') && !w.name.includes('Siti Rahayu')))) {
        w.name = REAL_LEADER;
        migrated = true;
      }
    }
  }

  // 3. Transactions Sanitization (Kas Keluar & Kas Masuk)
  if (S.txns) {
    const origT = S.txns.length;
    S.txns = S.txns.filter(t => {
      const fullText = (t.note || '') + ' ' + (t.vendor || '') + ' ' + (t.ref || '');
      if (FAKE_PEOPLE.some(fp => fullText.includes(fp))) return false;
      if (fullText.includes('Dr. Ir. Hj.') || fullText.includes('Bulan Okt 2026 (Tahap 1)')) return false;
      return true;
    });
    if (S.txns.length !== origT) migrated = true;

    for (const t of S.txns) {
      if (t.note && FAKE_TITLE_SNIPPETS.some(f => t.note.includes(f))) {
        t.note = t.note.replace(/Dr\.\s*Ir\.\s*Hj\.\s*Nadhiroh,?\s*M\.Kes/gi, REAL_LEADER)
                       .replace(/Dr\.\s*Ir\.\s*Hj\./gi, 'Dr.');
        migrated = true;
      }
      if (t.vendor && FAKE_TITLE_SNIPPETS.some(f => t.vendor.includes(f))) {
        t.vendor = t.vendor.replace(/Dr\.\s*Ir\.\s*Hj\.\s*Nadhiroh,?\s*M\.Kes/gi, REAL_LEADER)
                           .replace(/Dr\.\s*Ir\.\s*Hj\./gi, 'Dr.');
        migrated = true;
      }
    }
  }

  // 4. Payrolls Sanitization (Honorarium & Slip)
  if (S.payrolls) {
    const origP = S.payrolls.length;
    S.payrolls = S.payrolls.filter(p => {
      const fullText = (p.note || '') + ' ' + (p.period || '') + ' ' + (p.ref || '');
      if (FAKE_PEOPLE.some(fp => fullText.includes(fp))) return false;
      if (p.period && (p.period.includes('Bulan Okt 2026 (Tahap 1)') || p.period.includes('Bulan Juli 2026 (Tahap 1)'))) return false;
      if (p.wid && S.workers && !S.workers.some(w => w.id === p.wid)) return false;
      return true;
    });
    if (S.payrolls.length !== origP) migrated = true;

    for (const p of S.payrolls) {
      if (p.note && FAKE_TITLE_SNIPPETS.some(f => p.note.includes(f))) {
        p.note = p.note.replace(/Dr\.\s*Ir\.\s*Hj\.\s*Nadhiroh,?\s*M\.Kes/gi, REAL_LEADER)
                       .replace(/Dr\.\s*Ir\.\s*Hj\./gi, 'Dr.');
        migrated = true;
      }
    }
  }

  if (migrated) {
    saveState();
  }
}

function saveState() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    console.error('Failed to save state', e);
  }
}

function uid() {
  return 'z_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

/* Formatting helpers */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtN = n => Number(n || 0).toLocaleString('id-ID');
const parseN = s => Number(String(s || '0').replace(/[^0-9]/g, '')) || 0;
const rp = n => 'Rp ' + fmtN(n);
const rpC = n => 'Rp ' + fmtN(n);
const bigRp = n => {
  const s = fmtN(n);
  return '<span class="cur">Rp</span>' + s;
};

function rpWords(n) {
  n = Math.abs(Math.round(n || 0));
  if (n === 0) return 'Nol rupiah';
  const units = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  function terbilang(x) {
    if (x < 12) return units[x];
    if (x < 20) return terbilang(x - 10) + ' Belas';
    if (x < 100) return terbilang(Math.floor(x / 10)) + ' Puluh' + (x % 10 ? ' ' + terbilang(x % 10) : '');
    if (x < 200) return 'Seratus' + (x - 100 ? ' ' + terbilang(x - 100) : '');
    if (x < 1000) return terbilang(Math.floor(x / 100)) + ' Ratus' + (x % 100 ? ' ' + terbilang(x % 100) : '');
    if (x < 2000) return 'Seribu' + (x - 1000 ? ' ' + terbilang(x - 1000) : '');
    if (x < 1000000) return terbilang(Math.floor(x / 1000)) + ' Ribu' + (x % 1000 ? ' ' + terbilang(x % 1000) : '');
    if (x < 1000000000) return terbilang(Math.floor(x / 1000000)) + ' Juta' + (x % 1000000 ? ' ' + terbilang(x % 1000000) : '');
    return terbilang(Math.floor(x / 1000000000)) + ' Miliar' + (x % 1000000000 ? ' ' + terbilang(x % 1000000000) : '');
  }
  return terbilang(n) + ' Rupiah';
}

function fd(iso) {
  if (!iso) return '—';
  const parts = String(iso).slice(0, 10).split('-');
  if (parts.length < 3) return iso;
  const m = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return parts[2] + ' ' + m[Number(parts[1]) - 1] + ' ' + parts[0];
}

function fdl(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  return days[d.getDay()] + ', ' + fd(iso);
}

function today() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

/* Avatar & Monogram helpers (iOS Premium Design) */
function getInitials(name) {
  if (!name) return 'U';
  const clean = String(name)
    .replace(/\b(Dr|Ir|Hj|H|Prof|S\.?E|M\.?Kes|S\.?KM|M\.?Kom|S\.?T|M\.?Si|S\.?Kom|Ph\.?D)\b\.?/gi, '')
    .replace(/[,\.]/g, ' ')
    .trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) {
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  if (parts.length === 1 && parts[0].length >= 2) {
    return parts[0].slice(0, 2).toUpperCase();
  }
  return (String(name).trim()[0] || 'U').toUpperCase();
}

function getRoleGradient(role) {
  switch (role) {
    case 'superadmin':
      return 'linear-gradient(135deg, #7c3aed, #4f46e5)';
    case 'admin':
      return 'linear-gradient(135deg, #0284c7, #2563eb)';
    case 'ketua':
      return 'linear-gradient(135deg, #059669, #0d9488)';
    case 'bendahara':
      return 'linear-gradient(135deg, #d97706, #ea580c)';
    case 'peneliti':
      return 'linear-gradient(135deg, #9333ea, #db2777)';
    case 'asisten':
      return 'linear-gradient(135deg, #0891b2, #0284c7)';
    default:
      return 'linear-gradient(135deg, #475569, #334155)';
  }
}

function renderAvatar(u, size = 36, extraStyle = '') {
  const user = (typeof u === 'string') ? { name: u } : (u || {});
  const avatar = user.avatar;
  const name = user.name || user.username || 'Pengguna';
  const role = user.role || 'bendahara';

  if (avatar && avatar.length > 20) {
    return '<img src="' + esc(avatar) + '" alt="' + esc(name) + '" class="ios-avatar" ' +
      'style="width:' + size + 'px;height:' + size + 'px;min-width:' + size + 'px;min-height:' + size + 'px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,0.12);flex-shrink:0;' + extraStyle + '">';
  }

  const inits = getInitials(name);
  const grad = getRoleGradient(role);
  const fontSize = Math.max(9, Math.round(size * 0.38));

  return '<div class="ios-avatar" ' +
    'style="width:' + size + 'px;height:' + size + 'px;min-width:' + size + 'px;min-height:' + size + 'px;border-radius:50%;background:' + grad + ';color:#ffffff;font-weight:750;font-size:' + fontSize + 'px;line-height:1;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0.5px;border:1.5px solid rgba(255,255,255,0.25);box-shadow:0 2px 8px rgba(0,0,0,0.12);flex-shrink:0;user-select:none;' + extraStyle + '">' +
    esc(inits) +
  '</div>';
}

function toast(msg) {

/* Modal Bottom Sheet */
function sheet(title, bodyHtml, okText = 'Simpan', onOk = null, okClass = 'pri') {
  $('#sheet-t').textContent = title;
  $('#sheet-b').innerHTML = bodyHtml;
  $('#sheet-e').textContent = '';
  const okBtn = $('#sheet-ok');
  okBtn.textContent = okText;
  okBtn.className = 'btn block ' + okClass;
  okBtn.style.display = onOk ? '' : 'none';
  sheetOk = onOk;
  $('#sheet').classList.add('open');
  $('#sheetbg').classList.add('open');

  // Attach money input mask
  $$('#sheet-b input.money').forEach(inp => {
    inp.addEventListener('input', e => {
      const val = parseN(inp.value);
      inp.value = val ? fmtN(val) : '';
    });
  });

  setTimeout(() => {
    const firstInput = $('#sheet-b input:not([type=hidden]), #sheet-b select, #sheet-b textarea');
    if (firstInput) firstInput.focus({ preventScroll: true });
  }, 100);
}

function closeSheet() {
  $('#sheet').classList.remove('open');
  $('#sheetbg').classList.remove('open');
  sheetOk = null;
}

});

/* Project getters */
const P = () => S.projects.find(p => p.id === S.activeId) || S.projects[0];
const workersOf = pid => S.workers.filter(w => w.pid === pid);
const txnsOf = pid => S.txns.filter(t => t.pid === pid && !t.void);
const payrollsOf = pid => S.payrolls.filter(p => p.pid === pid);

function kasSaldo(pid) {
  const p = P();
  const tx = txnsOf(pid);
  const masuk = tx.filter(t => t.dir === 'in').reduce((s, t) => s + t.amount, 0);
  const keluar = tx.filter(t => t.dir === 'out').reduce((s, t) => s + t.amount, 0);
  const honorKeluar = payrollsOf(pid).reduce((s, p) => s + p.netto, 0);
  // Txns might already record honor, so check if honor is already in txns:
  const txHonor = tx.filter(t => t.dir === 'out' && t.cat === 'honor').reduce((s, t) => s + t.amount, 0);
  return (p.saldo || 0) + masuk - keluar - (honorKeluar > txHonor ? (honorKeluar - txHonor) : 0);
}

function totalRealisasi(pid) {
  const tx = txnsOf(pid);
  const belanja = tx.filter(t => t.dir === 'out' && t.cat !== 'honor').reduce((s, t) => s + t.amount, 0);
  const honorNetto = payrollsOf(pid).reduce((s, p) => s + p.netto, 0);
  const honorPajak = payrollsOf(pid).reduce((s, p) => s + p.tax_amt, 0);
  return belanja + honorNetto + honorPajak;
}

function totalPajak(pid) {
  const p = payrollsOf(pid);
  const pph21 = p.reduce((s, x) => s + (x.tax_amt || 0), 0);
  const tx = txnsOf(pid);
  const pph22 = tx.reduce((s, x) => s + (x.tax_pph22 || 0), 0);
  const pph23 = tx.reduce((s, x) => s + (x.tax_pph23 || 0), 0);
  const ppn = tx.reduce((s, x) => s + (x.tax_ppn || 0), 0);
  return { pph21, pph22, pph23, ppn, total: pph21 + pph22 + pph23 + ppn };
}

async function doLogin() {
  const u = $('#l-u')?.value.trim();
  const pw = $('#l-p')?.value || '';
  const btn = $('#btn-login');
  const er = $('#l-e');
  if (!u || !pw) {
    if (er) er.textContent = 'Masukkan username dan password.';
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Memeriksa…'; }
  if (er) er.textContent = '';

  const gps = CURRENT_GPS || await captureGps();

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: u,
        password: pw,
        lat: gps?.lat,
        lng: gps?.lng,
        acc: gps?.acc
      })
    });
    const res = await r.json();
    if (r.ok && res.user) {
      ME = res.user;
      CURRENT_ROLE = ME.role;
      MODE = 'server';
      toast('Berhasil masuk sebagai ' + ME.name + ' (' + (ROLE_L[ME.role] || ME.role) + ')');
      loadUsers();
      loadServerRoles();
      if (canSuperAdmin()) {
        checkBackupStatus();
        loadAuditLogs();
      }
      captureGps().then(pos => {
        if (pos) {
          fetch('/api/audit/ping', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pos)
          }).catch(() => {});
        }
      });
      render();
    } else {
      if (er) er.textContent = res.error || 'Username atau password salah.';
      if (btn) { btn.disabled = false; btn.textContent = 'Masuk'; }
    }
  } catch (err) {
    if (er) er.textContent = 'Gagal terhubung ke server: ' + err.message;
    if (btn) { btn.disabled = false; btn.textContent = 'Masuk'; }
  }
}

function feedHTML(pid) {
  const ev = [];
  txnsOf(pid).forEach(t => {
    if (t.cat === 'honor') return; // Rendered cleanly via payrollsOf below
    ev.push({
      d: t.date,
      ts: t.ts,
      txt: (t.dir === 'in' ? 'Masuk: ' : 'Keluar: ') + (t.note || t.cat),
      amt: (t.dir === 'in' ? 1 : -1) * t.amount
    });
  });
  payrollsOf(pid).forEach(p => {
    const w = S.workers.find(x => x.id === p.wid);
    ev.push({
      d: p.date,
      ts: p.ts,
      txt: 'Honor: ' + (w ? w.name : 'Personel') + ' (' + p.period + ')',
      amt: -p.netto
    });
  });
  ev.sort((a, b) => b.d.localeCompare(a.d) || (b.ts || 0) - (a.ts || 0));
  if (!ev.length) return '<p class="muted small" style="padding:10px 0">Belum ada transaksi dicatat.</p>';
  return '<ul class="feed">' +
    ev.slice(0, 6).map(e =>
      '<li>' +
        '<span class="d">' + fd(e.d) + '</span>' +
        '<span class="t">' + esc(e.txt) + '</span>' +
        '<span class="a ' + (e.amt > 0 ? 'in-c' : 'out-c') + '">' + (e.amt > 0 ? '+' : '−') + rp(Math.abs(e.amt)).replace('Rp ', '') + '</span>' +
      '</li>'
    ).join('') +
  '</ul>';
}

let currentProof = null;

  currentProof = null;
}

function handleProofFileSelect(event, previewContainerId) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  const isImg = file.type.startsWith('image/');

  if (!isPdf && !isImg) {
    alert('Format file tidak didukung. Harap pilih foto nota (JPG, PNG, WebP) atau berkas dokumen PDF.');
    return;
  }

  if (isPdf) {
    if (file.size > 5 * 1024 * 1024) {
      alert('Ukuran berkas PDF maksimal 5 MB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      currentProof = {
        dataUrl: e.target.result,
        name: file.name,
        type: 'pdf',
        size: file.size
      };
      renderProofPreview(previewContainerId);
    };
    reader.readAsDataURL(file);
    return;
  }

  // Compress image to readable OCR quality (max 1280px, ~60-120KB)
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1280;
      let w = img.width;
      let h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

      currentProof = {
        dataUrl: compressedDataUrl,
        name: file.name,
        type: 'image',
        size: Math.round(compressedDataUrl.length * 0.75)
      };
      renderProofPreview(previewContainerId);
    };
    img.onerror = () => {
      alert('Gagal memproses file foto nota.');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

        '<div class="tiny muted">' + (isImg ? 'Foto Nota/Kuitansi' : 'Dokumen PDF') + ' · ' + sizeKb + ' KB · <span style="color:var(--ok);font-weight:700">✓ Siap Disimpan</span></div>' +

function attachProofToTxn(txnId) {
  const t = S.txns.find(x => x.id === txnId);
  if (!t) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf';
  input.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const reader = new FileReader();
    reader.onload = ev => {
      if (isPdf) {
        t.proof = ev.target.result;
        t.proof_name = file.name;
        t.proof_type = 'pdf';
        t.spj_ok = true;
        saveState();
        toast('Bukti PDF berhasil dilampirkan ✓');
        sheetTxnDetail(txnId);
        render();
        return;
      }
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        t.proof = canvas.toDataURL('image/jpeg', 0.82);
        t.proof_name = file.name;
        t.proof_type = 'image';
        t.spj_ok = true;
        saveState();
        toast('Foto bukti nota berhasil dilampirkan ✓');
        sheetTxnDetail(txnId);
        render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function removeProofFromTxn(txnId) {
  if (!confirm('Hapus lampiran bukti nota ini?')) return;
  const t = S.txns.find(x => x.id === txnId);

  t.proof_name = null;
  t.proof_type = null;

function attachProofToPayroll(payId) {
  const pay = S.payrolls.find(p => p.id === payId);
  if (!pay) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf';
  input.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const reader = new FileReader();
    reader.onload = ev => {
      const applyProof = (dataUrl, pType) => {
        pay.proof = dataUrl;
        pay.proof_name = file.name;
        pay.proof_type = pType;

        const matchingTx = S.txns.find(t => t.ref === pay.ref && t.cat === 'honor');
        if (matchingTx) {
          matchingTx.proof = dataUrl;
          matchingTx.proof_name = file.name;
          matchingTx.proof_type = pType;
          matchingTx.spj_ok = true;
        }

        saveState();
        toast('Bukti transfer / slip gaji e-Bupot berhasil disimpan ✓');
        sheetSlipDetail(payId);
        render();
      };

      if (isPdf) {
        applyProof(ev.target.result, 'pdf');
        return;
      }

      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        applyProof(canvas.toDataURL('image/jpeg', 0.82), 'image');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function removeProofFromPayroll(payId) {
  if (!confirm('Hapus lampiran bukti transfer / slip gaji ini?')) return;
  const pay = S.payrolls.find(p => p.id === payId);
  if (!pay) return;
  pay.proof = null;
  pay.proof_name = null;
  pay.proof_type = null;

  const matchingTx = S.txns.find(t => t.ref === pay.ref && t.cat === 'honor');
  if (matchingTx) {
    matchingTx.proof = null;

    matchingTx.proof_type = null;

  sheetSlipDetail(payId);
  render();
}

  const p = P();

  let list = tx.slice();

function vTim() {

      ) +

      fld('Periode / Tahap Kegiatan', '<input id="fh-period" value="Bulan ' + fd(today()).split(' ')[1] + ' 2026 (Tahap 1)">') +
      fld('Nomor Kuitansi Resmi', '<input id="fh-ref" value="KWT-HNR-' + String(S.payrolls.length + 1).padStart(3, '0') + '">') +
      fld('Honor Bruto (Rp)', moneyIn('fh-gross'), 'Otomatis menghitung potongan PPh 21 sesuai golongan') +
      '<div class="card" style="background:var(--panel2)">' +
        '<div class="row between"><span class="small muted">Tarif PPh 21:</span><b id="fh-rate-label" class="small">—</b></div>' +
        '<div class="row between" style="margin-top:4px"><span class="small muted">Potongan Pajak:</span><b id="fh-tax" class="small num" style="color:var(--bad)">Rp 0</b></div>' +
        '<div class="row between" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><span class="lab" style="font-weight:700">Netto Diterima:</span><b id="fh-netto" class="val num in-c" style="font-size:18px">Rp 0</b></div>' +
      '</div>' +
      fld('Bukti Transfer Bank / Slip Gaji TTD (Syarat e-Bupot)',
        '<input type="file" id="fh-proof-preview-input" accept="image/*,application/pdf" style="display:none" onchange="handleProofFileSelect(event, \'fh-proof-preview\')">' +
        '<div id="fh-proof-preview"></div>'
      ) +
      fld('Keterangan', '<input id="fh-note" placeholder="Honorarium kegiatan analisis data / survei...">') +
    '</div>',
    'Simpan Slip Honor',
    () => {
      const wid = $('#fh-wid').value;
      const date = $('#fh-date').value || today();
      const period = $('#fh-period').value.trim();
      const ref = $('#fh-ref').value.trim();
      const gross = parseN($('#fh-gross').value);
      const note = $('#fh-note').value.trim();

      if (!gross) { $('#sheet-e').textContent = 'Masukkan nominal bruto honor.'; return; }

      const w = S.workers.find(x => x.id === wid);
      const g = GOL_RULES[w ? w.golongan : 'non_pns_npwp'] || GOL_RULES['non_pns_npwp'];
      const tax_amt = Math.round(gross * g.rate);
      const netto = gross - tax_amt;

      const newPay = {
        id: uid(),
        pid: p.id,
        wid,
        date,
        ts: Date.now(),
        period,
        ref,
        gross,
        tax_rate: g.rate,
        tax_amt,
        netto,
        note,
        paid: true,
        proof: currentProof ? currentProof.dataUrl : null,
        proof_name: currentProof ? currentProof.name : null,
        proof_type: currentProof ? currentProof.type : null
      };

      S.payrolls.push(newPay);

      // Also record to txns as cash out
      S.txns.push({
        id: uid(),
        pid: p.id,
        date,
        ts: Date.now(),
        dir: 'out',
        cat: 'honor',
        amount: netto,
        gross: gross,
        tax_pph21: tax_amt,
        tax_pph22: 0,
        tax_pph23: 0,
        tax_ppn: 0,
        wid,
        ref,
        note: (w ? w.name : 'Personel') + ' — ' + note,
        spj_ok: true,
        proof: newPay.proof,
        proof_name: newPay.proof_name,
        proof_type: newPay.proof_type,
        void: false
      });

      saveState();
      closeSheet();
      toast('Slip honor berhasil dibuat ✓');
      render();
      setTimeout(() => sheetSlipDetail(newPay.id), 300);
    }
  );

  setTimeout(calcHonorTax, 80);
  setTimeout(() => renderProofPreview('fh-proof-preview'), 80);
}

function sheetHonorForWorker(wid) {
  closeSheet();
  setTimeout(() => sheetHonorNew(wid), 150);
}

function calcHonorTax() {
  const wid = $('#fh-wid')?.value;
  const w = S.workers.find(x => x.id === wid);
  const grossInp = $('#fh-gross');
  if (w && (!grossInp.value || grossInp.value === '0')) {
    grossInp.value = fmtN(w.tarif || 0);
  }
  const gross = parseN(grossInp?.value || '0');
  const g = GOL_RULES[w ? w.golongan : 'non_pns_npwp'] || GOL_RULES['non_pns_npwp'];
  const tax = Math.round(gross * g.rate);
  const net = gross - tax;

  if ($('#fh-rate-label')) $('#fh-rate-label').textContent = (g.rate * 100).toFixed(1) + '% (' + g.label.split('(')[0].trim() + ')';
  if ($('#fh-tax')) $('#fh-tax').textContent = '− ' + rpC(tax);
  if ($('#fh-netto')) $('#fh-netto').textContent = rpC(net);
}

function sheetBatchEnumerator() {
  const p = P();
  const enums = S.workers.filter(w => w.pid === p.id && (w.role.toLowerCase().includes('enumerator') || w.role.toLowerCase().includes('surveyor')));
  if (!enums.length) {
    alert('Belum ada personel dengan peran Enumerator / Surveyor.');
    return;
  }

  sheet('Gaji Massal Enumerator Lapangan',
    '<div class="stack">' +
      '<p class="small muted">Pilih enumerator yang bertugas untuk membuat slip honorarium serentak.</p>' +
      '<div class="card list" style="max-height:220px;overflow-y:auto">' +
        enums.map(w =>
          '<label class="it" style="cursor:pointer">' +
            '<input type="checkbox" class="batch-chk" value="' + w.id + '" checked style="width:20px;height:20px;accent-color:var(--helm)">' +
            '<div class="t">' +
              '<b>' + esc(w.name) + '</b>' +
              '<span>' + esc(w.role) + ' · Tarif ' + rpC(w.tarif) + '/' + esc(w.unit) + '</span>' +
            '</div>' +
          '</label>'
        ).join('') +
      '</div>' +
      fld('Jumlah Hari / Satuan Kerja', '<input type="number" id="fb-qty" value="5" min="1" max="30">', 'Dikalikan dengan tarif harian masing-masing') +
      fld('Tanggal Pembayaran', '<input type="date" id="fb-date" value="' + today() + '">') +
      fld('Keterangan Kegiatan', '<input id="fb-note" value="Honor survei lapang posyandu 5 hari">') +
    '</div>',
    'Bayar Semua Terpilih',
    () => {
      const chks = $$('.batch-chk:checked');
      if (!chks.length) { $('#sheet-e').textContent = 'Pilih minimal satu enumerator.'; return; }
      const qty = Number($('#fb-qty').value) || 1;
      const date = $('#fb-date').value || today();
      const note = $('#fb-note').value.trim();

      chks.forEach((chk, idx) => {
        const w = S.workers.find(x => x.id === chk.value);
        if (!w) return;
        const gross = w.tarif * qty;
        const g = GOL_RULES[w.golongan] || GOL_RULES['non_pns_non'];
        const tax_amt = Math.round(gross * g.rate);
        const netto = gross - tax_amt;
        const ref = 'KWT-ENUM-' + String(S.payrolls.length + idx + 1).padStart(3, '0');

        S.payrolls.push({
          id: uid(),
          pid: p.id,
          wid: w.id,
          date,
          ts: Date.now() + idx,
          period: 'Survei Lapangan (' + qty + ' ' + (w.unit || 'hari') + ')',
          ref,
          gross,
          tax_rate: g.rate,
          tax_amt,
          netto,
          note,
          paid: true
        });

        S.txns.push({
          id: uid(),
          pid: p.id,
          date,
          ts: Date.now() + idx,
          dir: 'out',
          cat: 'honor',
          amount: netto,
          gross,
          tax_pph21: tax_amt,
          tax_pph22: 0,
          tax_pph23: 0,
          tax_ppn: 0,
          wid: w.id,
          ref,
          note: w.name + ' — ' + note,
          spj_ok: true,
          void: false
        });
      });

      saveState();
      closeSheet();
      toast(chks.length + ' honor enumerator berhasil dibuat');
      render();
    }
  );
}

function sheetSlipDetail(payId) {
  const pay = S.payrolls.find(p => p.id === payId);
  if (!pay) return;

function toggleApprovePayroll(payId) {
  const pay = S.payrolls.find(p => p.id === payId);
  if (!pay) return;
  pay.approved = !pay.approved;
  saveState();
  closeSheet();
  toast(pay.approved ? 'Kuitansi telah disetujui & disahkan Ketua' : 'Persetujuan kuitansi dibatalkan');
  render();
  setTimeout(() => sheetSlipDetail(payId), 200);
}

function deletePayroll(id) {
  if (!confirm('Yakin ingin membatalkan slip honor ini? Transaksi kas terkait juga akan dihapus.')) return;
  const pay = S.payrolls.find(p => p.id === id);
  if (pay) {
    S.txns = S.txns.filter(t => t.ref !== pay.ref);
  }
  S.payrolls = S.payrolls.filter(p => p.id !== id);
  saveState();
  closeSheet();
  toast('Slip honor dibatalkan');
  render();
}

function exportCoretaxCSV() {
  const pays = payrollsOf(P().id);
  let csv = 'Kode Pajak,Nama Penerima,NIK (16 Digit),NPWP,Bruto,Tarif Pajak,Potongan PPh 21,Tanggal,No Bukti Potong,Status Bukti Slip\n';
  pays.forEach(pay => {
    const w = S.workers.find(x => x.id === pay.wid);
    csv += [
      '21-100-01',
      '"' + (w ? w.name : '') + '"',
      w ? w.nik : '',
      w ? w.npwp : '',
      pay.gross,
      (pay.tax_rate * 100).toFixed(1) + '%',
      pay.tax_amt,
      pay.date,
      pay.ref,
      pay.proof ? '"Ada Bukti (' + (pay.proof_name || 'Tersimpan') + ')"' : '"Belum Upload Slip"'
    ].join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Coretax_DJP_PPh21_' + today() + '.csv';
  a.click();
  toast('File CSV Coretax siap diimpor ke e-Bupot');
}

async function loadAuditLogs(cat = AUDIT_CAT, q = AUDIT_SEARCH) {
  if (!canSuperAdmin()) return;
  AUDIT_LOADING = true;
  try {
    const url = `/api/audit-logs?cat=${encodeURIComponent(cat)}&q=${encodeURIComponent(q)}&limit=150`;
    const r = await fetch(url);
    if (r.ok) {
      const data = await r.json();
      AUDIT_LOGS = data.logs || [];
      if (data.stats) AUDIT_STATS = data.stats;
    }
  } catch (e) {
    console.error('Failed to load audit logs', e);
  } finally {
    AUDIT_LOADING = false;
    render();
  }
}

async function doAuditPurge(mode) {
  if (!confirm(mode === 'all' ? 'PERINGATAN: Seluruh catatan log aktivitas akan dihapus permanen. Lanjutkan?' : 'Hapus catatan log yang lebih lama dari 30 hari?')) return;
  closeSheet();
  try {
    const payload = mode === 'all' ? { all: true } : { olderThanDays: 30 };
    const r = await fetch('/api/audit-logs', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      toast('Catatan log berhasil dibersihkan');
      loadAuditLogs();
    }
  } catch (e) {
    alert('Gagal membersihkan log: ' + e.message);
  }
}

  } else if (AUDIT_LOGS.length === 0) {
    listHtml = '<div class="card small muted" style="text-align:center;padding:32px">Belum ada riwayat aktivitas yang tercatat untuk filter ini.</div>';
  } else {
    listHtml = AUDIT_LOGS.map(log => {
      const isFailed = log.action === 'LOGIN_FAILED';
      const isRestore = log.action.includes('RESTORE');
      const isDelete = log.action.includes('DELETE');

      const avatar = isFailed ? '🚨' : (log.role === 'superadmin' ? '👑' : (log.role === 'ketua' ? '🎓' : (log.role === 'bendahara' ? '💼' : (log.category === 'backup' ? '💾' : '📝'))));
      const borderCol = isFailed ? 'var(--bad)' : (isRestore ? 'var(--warning)' : (log.role === 'superadmin' ? 'var(--bad)' : 'var(--line)'));

      const dt = new Date(log.created_at);
      const timeStr = dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateStr = dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

      let gpsHtml = '';
      if (log.gps_lat != null && log.gps_lng != null) {
        const mapsUrl = `https://www.google.com/maps?q=${log.gps_lat},${log.gps_lng}`;
        gpsHtml = '<a href="' + mapsUrl + '" target="_blank" rel="noopener" class="pill" style="background:rgba(16,185,129,0.12);color:var(--ok);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px">' +
          '📍 ' + log.gps_lat.toFixed(4) + ', ' + log.gps_lng.toFixed(4) + ' (±' + (log.gps_acc || 0) + 'm) <span style="font-size:11px">↗ Maps</span>' +
        '</a>';
      } else {
        gpsHtml = '<span class="pill muted" style="font-size:11px">📍 GPS Off / Ditutup</span>';
      }

      return '<div class="card" style="border-left:3.5px solid ' + borderCol + ';padding:12px 14px">' +
        '<div class="row between" style="align-items:flex-start">' +
          '<div class="row" style="gap:8px;align-items:center">' +
            '<span style="font-size:20px">' + avatar + '</span>' +
            '<div>' +
              '<div class="row" style="gap:6px;align-items:center">' +
                '<b style="font-size:14px">' + esc(log.username || 'Tamu / Anon') + '</b>' +
                '<span class="badge ' + (isFailed ? 'bad' : (log.role === 'superadmin' ? 'bad' : 'info')) + '">' + esc(log.role || 'guest') + '</span>' +
              '</div>' +
              '<div class="tiny muted num">' + dateStr + ' · ' + timeStr + '</div>' +
            '</div>' +
          '</div>' +
          '<span class="badge ' + (isFailed || isDelete ? 'bad' : 'ok') + '" style="font-size:10.5px">' + esc(log.action) + '</span>' +
        '</div>' +

        '<div style="font-size:13.5px;margin:8px 0 6px;line-height:1.4">' + esc(log.description) + '</div>' +

        '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">' +
          '<span class="pill" style="background:var(--panel2);font-size:11px">' + esc(log.device_info || 'Perangkat Tidak Dikenal') + '</span>' +
          '<a href="https://ipinfo.io/' + esc(log.ip) + '" target="_blank" rel="noopener" class="pill" style="background:var(--panel2);text-decoration:none;color:var(--ink);font-size:11px">' +
            '🌐 IP: ' + esc(log.ip) + ' ↗' +
          '</a>' +
          gpsHtml +
        '</div>' +
      '</div>';
    }).join('');
  }

  return '<div class="stack">' +
    backBar('Catatan Mata-mata &amp; Audit Log') +

    '<div class="hero" style="background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%)">' +
      '<div class="lab" style="color:var(--hero-muted)">Pusat Intelijen Sistem ZanFin</div>' +
      '<div class="big" style="font-size:clamp(24px,6.8vw,32px);color:#38bdf8">🕵️‍♂️ Catatan Aktivitas</div>' +
      '<div class="words">Memantau siapapun yang login, mengedit data, IP, device &amp; koordinat GPS</div>' +
      '<div class="flow">' +
        '<div>Total Aksi<b>' + AUDIT_STATS.total + '</b></div>' +
        '<div>Aktivitas Hari Ini<b>' + AUDIT_STATS.today + '</b></div>' +
        '<div>Percobaan Gagal<b style="color:var(--bad)">' + AUDIT_STATS.failedToday + '</b></div>' +
      '</div>' +
    '</div>' +

    '<div class="card" style="padding:10px 14px">' +
      '<div class="row" style="gap:8px">' +
        '<input type="search" id="audit-search-input" value="' + esc(AUDIT_SEARCH) + '" placeholder="🔍 Cari username, IP, aksi, atau perangkat…" oninput="onAuditSearch(this.value)" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:var(--bg)">' +
        '<button class="btn sm" onclick="loadAuditLogs()" title="Segarkan">🔄</button>' +
        '<button class="btn sm bad" onclick="sheetAuditPurge()" title="Bersihkan Log">🗑️</button>' +
      '</div>' +
    '</div>' +

    '<div class="fchips">' +
      chips.map(([id, label]) =>
        '<button class="fchip" aria-pressed="' + (AUDIT_CAT === id ? 'true' : 'false') + '" onclick="filterAuditCat(\'' + id + '\')">' + label + '</button>'
      ).join('') +
    '</div>' +

    '<div class="stack" style="gap:10px">' +
      listHtml +
    '</div>' +
  '</div>';
}

/* ==========================================================================
   SUB-VIEW: PUSAT BACKUP & PEMULIHAN SISTEM (SUPERADMIN ONLY)
   ========================================================================== */
function doBackupDownload(filename = null) {
  const url = filename ? ('/api/backup/download?file=' + encodeURIComponent(filename)) : '/api/backup/download';
  toast('Menyiapkan file cadangan…');
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || ('zanfin-backup-' + new Date().toISOString().slice(0, 10) + '.json');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => {
    checkBackupStatus().then(render);
    toast('Snapshot cadangan berhasil diunduh');
  }, 1200);
}

function handleRestoreFileSelected(input) {
  if (input.files && input.files[0]) {
    SELECTED_RESTORE_FILE = input.files[0];
    render();
  }
}

async function doRestoreSubmit() {
  if (!SELECTED_RESTORE_FILE) {
    alert('Pilih file cadangan (.json) terlebih dahulu');
    return;
  }
  
  if (!confirm('PERINGATAN RESIKO TINGGI:\n\nMemulihkan database akan menimpa seluruh transaksi, akun, peran, dan data sistem saat ini dengan isi file cadangan.\n\nApakah Anda benar-benar yakin ingin melanjutkan pemulihan data?')) {
    return;
  }

  showSheet('Memulihkan Database…', '<div class="stack" style="text-align:center;padding:24px"><div style="font-size:36px">⏳</div><p>Sedang merekonstruksi data keuangan, akun & peran…</p></div>', '');
  
  try {
    const text = await SELECTED_RESTORE_FILE.text();
    const r = await fetch('/api/backup/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: text
    });
    const res = await r.json();
    if (r.ok) {
      closeSheet();
      alert('Berhasil! Database telah dipulihkan (' + res.restored.records + ' data, ' + res.restored.users + ' akun, ' + (res.restored.roles || 0) + ' peran).\n\nAplikasi akan dimuat ulang sekarang.');
      location.reload();
    } else {
      closeSheet();
      alert('Gagal memulihkan database: ' + (res.error || 'Terjadi kesalahan sistem'));
    }
  } catch (err) {
    closeSheet();
    alert('Terjadi kesalahan saat memproses file: ' + err.message);
  }
}

async function doRestoreFromVps(filename) {
  if (!confirm('PERINGATAN RESIKO:\n\nMemulihkan database dari snapshot server "' + filename + '" akan menimpa seluruh database aktif saat ini.\n\nLanjutkan pemulihan?')) {
    return;
  }
  showSheet('Memulihkan Database…', '<div class="stack" style="text-align:center;padding:24px"><div style="font-size:36px">⏳</div><p>Mengambil file cadangan dari server dan merekonstruksi database…</p></div>', '');

  try {
    const rFile = await fetch('/api/backup/download?file=' + encodeURIComponent(filename));
    const json = await rFile.text();
    const r = await fetch('/api/backup/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: json
    });
    const res = await r.json();
    if (r.ok) {
      closeSheet();
      alert('Berhasil! Database dipulihkan dari snapshot server (' + res.restored.records + ' data, ' + res.restored.users + ' akun).\n\nHalaman akan dimuat ulang.');
      location.reload();
    } else {
      closeSheet();
      alert('Gagal: ' + (res.error || 'Gagal memulihkan'));
    }
  } catch (err) {
    closeSheet();
    alert('Gagal: ' + err.message);
  }
}

/* Sub-View: Checklist SPJ */
function vSpj() {
  const p = P();
  const c = S.spjChecklist = S.spjChecklist || {};
  const items = [
    ['kontrak', 'Surat Kontrak Penelitian / SP2D', 'Kontrak induk hibah dari DRTPM Kemendikbudristek / BRIN / LPPM'],
    ['sk_tim', 'SK Pengangkatan Tim & Pembantu Peneliti', 'Surat Keputusan Dekan / Rektor penetapan ketua, asisten & surveyor'],
    ['kuitansi', 'Kuitansi & Nota Pembelian Bermaterai', 'Bukti pengeluaran belanja bahan, sewa alat dan perjalanan lapang'],
    ['absensi_fgd', 'Daftar Hadir & Notulensi FGD / Rapat', 'Daftar absensi tanda tangan basah & dokumentasi diskusi pakar'],
    ['transfer_honor', 'Bukti Transfer Bank & Kuitansi Honor', 'Slip tanda terima honor bertanda tangan + KTP + bukti transfer bank'],
    ['foto_lapangan', 'Foto Dokumentasi Kegiatan Riset', 'Foto pelaksanaan survei lapangan, uji lab, dan observasi posyandu'],
    ['laporan_kemajuan', 'Draft Laporan Kemajuan / Hasil', 'Dokumen laporan kemajuan serapan anggaran tahap 1 (70%)']
  ];

  const doneCount = items.filter(([k]) => c[k]).length;
  const pct = Math.round((doneCount / items.length) * 100);

  const txOut = txnsOf(p.id).filter(t => t.dir === 'out');
  const txWithProof = txOut.filter(t => Boolean(t.proof)).length;
  const pays = payrollsOf(p.id);
  const payWithProof = pays.filter(p => Boolean(p.proof)).length;

  return '<div class="stack">' +
    backBar('Checklist Kelengkapan SPJ') +
    '<div class="card">' +
      '<div class="row between">' +
        '<span class="lab">Kesiapan Berkas SPJ &amp; LPJ</span>' +
        '<b class="num ' + (pct === 100 ? 'in-c' : '') + '">' + pct + '%</b>' +
      '</div>' +
      '<div class="ruler"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sub">' + doneCount + ' dari ' + items.length + ' syarat mutlak berkas SPJ sudah diverifikasi</div>' +
    '</div>' +

    /* Ringkasan Bukti Digital yang Terunggah */
    '<div class="card stack" style="gap:10px;background:var(--panel2)">' +
      '<div class="lab" style="font-weight:750">Status Bukti Digital &amp; e-Bupot Terunggah</div>' +
      '<div class="grid2">' +
        '<div style="background:var(--panel);padding:10px 12px;border-radius:10px;border:1px solid var(--line)">' +
          '<div class="small muted">Nota Belanja Kas</div>' +
          '<div style="font-size:18px;font-weight:800;margin:2px 0">' + txWithProof + ' / ' + txOut.length + ' <span style="font-size:12px;font-weight:600">terlampir</span></div>' +
          (txOut.length > txWithProof ? '<span class="pill warning" style="font-size:10px;padding:1px 6px">⚠️ ' + (txOut.length - txWithProof) + ' belum ada nota</span>' : '<span class="pill ok" style="font-size:10px;padding:1px 6px">✓ Semua ada nota</span>') +
        '</div>' +
        '<div style="background:var(--panel);padding:10px 12px;border-radius:10px;border:1px solid var(--line)">' +
          '<div class="small muted">Bukti Transfer Honor</div>' +
          '<div style="font-size:18px;font-weight:800;margin:2px 0">' + payWithProof + ' / ' + pays.length + ' <span style="font-size:12px;font-weight:600">terlampir</span></div>' +

      ).join('') +
    '</div>' +
  '</div>';

function exportBKU() {
  const p = P();
  const tx = txnsOf(p.id).sort((a, b) => a.date.localeCompare(b.date));
  let saldo = p.saldo || 0;

  const rows = [
    ['BUKU KAS UMUM (BKU) PENELITIAN'],
    ['Judul Penelitian: ' + p.name],
    ['Ketua Peneliti: ' + p.leader],
    ['Tahun Anggaran: ' + p.year],
    [],
    ['No', 'Tanggal', 'No Bukti', 'Kategori', 'Keterangan', 'Penerimaan (Rp)', 'Pengeluaran (Rp)', 'Saldo (Rp)', 'Lampiran Bukti']
  ];

  tx.forEach((t, i) => {
    const deb = t.dir === 'in' ? t.amount : 0;
    const krd = t.dir === 'out' ? t.amount : 0;
    saldo += deb - krd;
    rows.push([
      i + 1,
      t.date,
      t.ref || '',
      CAT_IN[t.cat] || CAT_OUT[t.cat] || t.cat,
      t.note || '',
      deb,
      krd,
      saldo,
      t.proof ? 'Ada Bukti (' + (t.proof_name || 'Tersimpan') + ')' : (t.dir === 'out' ? 'Belum Ada Nota' : 'Penerimaan')
    ]);
  });

  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'BKU');
    XLSX.writeFile(wb, 'BKU_Penelitian_' + p.year + '.xlsx');
    toast('File Excel BKU berhasil diunduh');
  } else {
    alert('Modul Excel belum selesai dimuat, coba sesaat lagi.');
  }
}

function exportRealisasi() {
  const p = P();
  const tx = txnsOf(p.id);

  const pos = {
    honor: { name: 'Honorarium Tim & Pembantu Peneliti', real: 0 },
    bahan: { name: 'Bahan Habis Pakai / ATK Lab', real: 0 },
    alat: { name: 'Sewa & Pengadaan Alat', real: 0 },
    perjalanan: { name: 'Perjalanan & Transportasi Lapang', real: 0 },
    publikasi: { name: 'Publikasi Jurnal & Prosiding', real: 0 },
    ops: { name: 'Operasional & FGD', real: 0 }
  };

  tx.filter(t => t.dir === 'out').forEach(t => {
    if (pos[t.cat]) pos[t.cat].real += t.amount;
  });

  const rows = [
    ['LAPORAN REALISASI ANGGARAN PENELITIAN'],
    ['Judul: ' + p.name],
    ['Ketua: ' + p.leader],
    ['Total Pagu: Rp ' + fmtN(p.pagu)],
    [],
    ['No', 'Pos Pengeluaran', 'Realisasi (Rp)']
  ];

  let total = 0;
  Object.values(pos).forEach((item, idx) => {
    rows.push([idx + 1, item.name, item.real]);
    total += item.real;
  });
  rows.push(['', 'TOTAL REALISASI', total]);
  rows.push(['', 'SISA DANA PAGU', p.pagu - total]);

  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Realisasi');
    XLSX.writeFile(wb, 'Realisasi_Anggaran_' + p.year + '.xlsx');
    toast('Laporan realisasi berhasil diunduh');
  } else {
    alert('Modul Excel sedang disiapkan.');
  }
}

async function handleAvatarFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    toast('File harus berupa gambar (JPG, PNG, WebP).');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      try {
        const targetSize = 320;
        const canvas = document.createElement('canvas');
        canvas.width = targetSize;
        canvas.height = targetSize;
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;

        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, targetSize, targetSize);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);

        await saveProfileAvatar(compressedBase64);
      } catch (err) {
        toast('Gagal memproses gambar: ' + err.message);
      }
    };
    img.onerror = function() {
      toast('File gambar tidak valid atau rusak.');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfileAvatar(avatarBase64) {

    const r = await fetch('/api/me/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: ME ? ME.name : undefined,

    });
    const res = await r.json();
    if (r.ok && res.user) {

      renderHeader();

    } else {
      toast('Gagal: ' + (res.error || 'Server menolak update'));
    }
  } catch (err) {
    toast('Koneksi error: ' + err.message);
  }
}

async function doChangePassword() {
  const oldPass = $('#acc-oldpass')?.value || '';
  const newPass = $('#acc-newpass')?.value || '';
  const confirmPass = $('#acc-confirmpass')?.value || '';
  const errEl = $('#acc-pass-err');

  if (errEl) errEl.textContent = '';

  if (!oldPass) {
    if (errEl) errEl.textContent = 'Masukkan password saat ini.';
    return;
  }
  if (!newPass || newPass.length < 6) {
    if (errEl) errEl.textContent = 'Password baru minimal 6 karakter.';
    return;
  }
  if (newPass !== confirmPass) {
    if (errEl) errEl.textContent = 'Konfirmasi password baru tidak cocok.';
    return;
  }

  try {
    const r = await fetch('/api/me/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        oldPassword: oldPass,
        newPassword: newPass
      })
    });
    const res = await r.json();
    if (r.ok) {
      toast('Password akun berhasil diperbarui! 🔒');
      if ($('#acc-oldpass')) $('#acc-oldpass').value = '';
      if ($('#acc-newpass')) $('#acc-newpass').value = '';
      if ($('#acc-confirmpass')) $('#acc-confirmpass').value = '';
      if (errEl) errEl.textContent = '';
    } else {
      if (errEl) errEl.textContent = res.error || 'Gagal mengganti password.';
      else toast(res.error || 'Gagal mengganti password.');
    }
  } catch (err) {
    if (errEl) errEl.textContent = 'Error koneksi: ' + err.message;
    else toast('Error: ' + err.message);
  }
}

        '</div>' +
      '</div>' +

      '<div class="card stack" style="gap:8px">' +
        '<h3>Ganti Peran / Akun Lain</h3>' +
        '<p class="small muted" style="margin:0">Untuk keamanan dan integritas keuangan riset, pergantian akun wajib memasukkan password yang valid.</p>' +
        '<button class="btn block" onclick="sheetSwitchAccount()">Ganti Akun (Login)</button>' +
      '</div>' +

      (canSuperAdmin() ?
        '<button class="btn block" onclick="closeSheet();go(null, \'roles\')">🎭 Kelola Peran &amp; Hak Akses</button>' : '') +

      '<button class="btn bad block" onclick="closeSheet();doLogout()">Keluar (Logout)</button>' +
    '</div>',
    'Tutup',
    () => closeSheet()
  );
}

function sheetSwitchAccount() {
  closeSheet();
  sheet('Masuk Akun Lain',
    '<div class="stack">' +
      fld('Username Akun', '<input id="sw-u" autocomplete="username" placeholder="admin / ketua / bendahara">') +
      fld('Password', '<input type="password" id="sw-p" autocomplete="current-password" placeholder="••••••••">') +
      '<p class="small muted" style="margin:0">Masukkan username dan password akun yang dituju untuk berpindah sesi.</p>' +
    '</div>',
    'Masuk',
    async () => {
      const u = $('#sw-u')?.value.trim();
      const pw = $('#sw-p')?.value || '';
      if (!u || !pw) {
        $('#sheet-e').textContent = 'Masukkan username & password.';
        return;
      }
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: pw })
        });
        const res = await r.json();
        if (r.ok && res.user) {
          ME = res.user;
          CURRENT_ROLE = ME.role;
          closeSheet();
          toast('Berhasil masuk sebagai ' + ME.name + ' (' + (ROLE_L[ME.role] || ME.role) + ')');
          loadUsers();
          loadServerRoles();
          render();
        } else {
          $('#sheet-e').textContent = res.error || 'Password salah.';
        }
      } catch (err) {
        $('#sheet-e').textContent = 'Error: ' + err.message;
      }
    }
  );
}

function renderNav() {
  const navEl = $('#nav');
  if (!navEl) return;
  navEl.innerHTML =
    '<div class="in">' +
      NAV_TABS.map(([k, label]) => {
        const isCurrent = !sub && view === k;
        return '<button onclick="go(\'' + k + '\', null)" ' + (isCurrent ? 'aria-current="page"' : '') + '>' +
          svg(k) +
          '<span>' + label + '</span>' +
        '</button>';
      }).join('') +
    '</div>';
}

function render() {
  if (!ME) {
    const topEl = $('#top');
    if (topEl) {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      topEl.innerHTML =
        '<div style="font-weight:800;font-size:18px">🏛️ Zan<span style="color:var(--helm)">Fin</span></div>' +
        '<div style="flex:1"></div>' +
        '<button class="iconbtn" onclick="toggleTheme()" aria-label="Ganti Tema" style="min-width:36px;min-height:36px">' +
          svg(isDark ? 'sun' : 'moon') +
        '</button>';
    }
    const navEl = $('#nav');
    if (navEl) navEl.innerHTML = '';
    const viewEl = $('#view');
    if (viewEl) viewEl.innerHTML = vLogin();
    return;
  }

  renderHeader();
  renderNav();
  const viewEl = $('#view');
  if (!viewEl) return;

  if (sub === 'akun') viewEl.innerHTML = vAkun();
  else if (sub === 'proyek') viewEl.innerHTML = vProyek();
  else if (sub === 'ekspor') viewEl.innerHTML = vEkspor();
  else if (sub === 'spj') viewEl.innerHTML = vSpj();
  else if (sub === 'pajak') viewEl.innerHTML = vPajak();
  else if (sub === 'users') viewEl.innerHTML = vUsers();
  else if (sub === 'roles') viewEl.innerHTML = vRoles();
  else if (sub === 'audit') viewEl.innerHTML = vAudit();
  else if (sub === 'backup') viewEl.innerHTML = vBackup();
  else if (view === 'nadi') viewEl.innerHTML = vNadi();
  else if (view === 'kas') viewEl.innerHTML = vKas();
  else if (view === 'tim') viewEl.innerHTML = vTim();
  else if (view === 'honor') viewEl.innerHTML = vHonor();
  else if (view === 'lainnya') viewEl.innerHTML = vLainnya();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  renderHeader();
}

async function init() {
  view = 'nadi';
  sub = null;

  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }

  loadState();

  try {
    const r = await fetch('/api/me');
    if (r.ok) {
      const data = await r.json();
      ME = data.user;
      MODE = 'server';
      loadUsers();
      if (canSuperAdmin()) {
        checkBackupStatus();
      }
      captureGps().then(pos => {
        if (pos) {
          fetch('/api/audit/ping', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pos)
          }).catch(() => {});
        }
      });
    }
  } catch (e) {
    MODE = 'local';
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
  }

  loadServerRoles();
  render();

  // Dismiss splash screen smoothly after app initialization
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.classList.add('hide');
      setTimeout(() => {
        splash.style.display = 'none';
      }, 500);
    }
  }, 1100);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
