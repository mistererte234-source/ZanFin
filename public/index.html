<style>
:root {
  --bg: #F1F5F3;
  --panel: #FFFFFF;
  --panel2: #E8EFEA;
  --ink: #0F172A;
  --muted: #596E63;
  --line: #D0DBD3;
  --helm: #10B981;
  --helm-ink: #FFFFFF;
  --ok: #10B981;
  --bad: #E11D48;
  --info: #0284C7;
  --warning: #F59E0B;
  --hero: #0F172A;
  --hero-ink: #F8FAFC;
  --hero-muted: #94A3B8;
  --tick: rgba(15, 23, 42, 0.35);
  --tick2: rgba(15, 23, 42, 0.15);
  --glass: rgba(241, 245, 243, 0.78);
  --glass-strong: rgba(255, 255, 255, 0.88);
  --glass-line: rgba(15, 23, 42, 0.08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090E11;
    --panel: #11181D;
    --panel2: #182228;
    --ink: #EDF3F7;
    --muted: #8296A4;
    --line: #22313A;
    --helm: #10B981;
    --helm-ink: #032117;
    --ok: #10B981;
    --bad: #F43F5E;
    --info: #38BDF8;
    --warning: #FBBF24;
    --hero: #11181D;
    --hero-ink: #F8FAFC;
    --hero-muted: #8FA2B0;
    --tick: rgba(237, 243, 247, 0.28);
    --tick2: rgba(237, 243, 247, 0.14);
    --glass: rgba(9, 14, 17, 0.78);
    --glass-strong: rgba(17, 24, 29, 0.90);
    --glass-line: rgba(237, 243, 247, 0.08);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #090E11;
  --panel: #11181D;
  --panel2: #182228;
  --ink: #EDF3F7;
  --muted: #8296A4;
  --line: #22313A;
  --helm: #10B981;
  --helm-ink: #032117;
  --ok: #10B981;
  --bad: #F43F5E;
  --info: #38BDF8;
  --warning: #FBBF24;
  --hero: #11181D;
  --hero-ink: #F8FAFC;
  --hero-muted: #8FA2B0;
  --tick: rgba(237, 243, 247, 0.28);
  --tick2: rgba(237, 243, 247, 0.14);
  --glass: rgba(9, 14, 17, 0.78);
  --glass-strong: rgba(17, 24, 29, 0.90);
  --glass-line: rgba(237, 243, 247, 0.08);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Archivo, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}

.num { font-variant-numeric: tabular-nums; font-stretch: 110%; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }

h1, h2, h3 { margin: 0; line-height: 1.15; }
h2 { font-size: 21px; font-weight: 800; font-stretch: 112%; }
h3 { font-size: 16px; font-weight: 750; }

/* Sticky Top Header */
header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  margin: 0 -16px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--glass-line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.projbtn {
  flex: 1;
  min-width: 0;
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.projbtn b {
  display: block;
  font-size: 17px;
  font-weight: 800;
  font-stretch: 112%;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.projbtn span {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 650;
  background: var(--panel2);
  border: 1px solid var(--line);
  white-space: nowrap;
  cursor: pointer;
}
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--bad); }
.pill.info { color: var(--info); }
.pill.warning { color: var(--warning); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Fixed Bottom Nav Dock */
nav.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--glass-line);
  z-index: 30;
  display: flex;
  justify-content: center;
}
nav.bottom .in {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  max-width: 560px;
  width: 100%;
}
nav.bottom button {
  min-height: 58px;
  background: none;
  border: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: color 0.15s ease;
}
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--ink); font-weight: 800; }
nav.bottom button[aria-current="page"] svg { color: var(--helm); }
nav.bottom button[aria-current="page"]::after {
  content: "";
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--helm);
  margin-top: 1px;
}

.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 > * { min-width: 0; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.card .lab { font-size: 13px; color: var(--muted); font-weight: 650; }
.card .val {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: clamp(18px, 5.2vw, 22px);
  font-weight: 800;
  font-stretch: 112%;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  line-height: 1.15;
}
.card .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
button.card { text-align: left; cursor: pointer; width: 100%; }

/* Hero Card */
.hero {
  background: var(--hero);
  color: var(--hero-ink);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
}
.hero .lab { color: var(--hero-muted); font-size: 13.5px; font-weight: 650; }
.hero .big {
  font-size: clamp(32px, 9vw, 44px);
  font-weight: 800;
  color: var(--helm);
  font-stretch: 115%;
  letter-spacing: -0.01em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  margin: 4px 0 2px;
  white-space: nowrap;
  overflow: hidden;
}
.hero .big .cur { font-size: 0.55em; font-weight: 700; margin-right: 0.12em; vertical-align: 0.45em; opacity: 0.9; }
.hero .words { font-size: 12.5px; color: var(--hero-muted); margin-bottom: 12px; min-height: 1.1em; }
.hero .flow {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  padding-top: 12px;
}
.hero .flow div { font-size: 12px; color: var(--hero-muted); }
.hero .flow b {
  display: block;
  color: var(--hero-ink);
  font-size: 12.5px;
  font-stretch: 95%;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

/* Progress bar ruler */
.ruler {
  position: relative;
  height: 14px;
  border-radius: 4px;
  background: var(--panel2);
  overflow: hidden;
  border: 1px solid var(--line);
  margin-top: 8px;
}
.ruler i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--helm); border-radius: 3px; }

/* Filter chips horizontal scroll */
.fchips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.fchips::-webkit-scrollbar { display: none; }
.fchip {
  flex: none;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-weight: 650;
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.fchip[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: transparent;
}

/* 2x2 Quick Action Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  min-height: 86px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.tile:active { transform: scale(0.98); }
.tile b { font-size: 15.5px; font-weight: 750; color: var(--ink); }
.tile span { font-size: 12.5px; color: var(--muted); }

/* Clean List Rows (Zero off-grid table!) */
.card.list { padding: 0 14px; }
.list .it {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--line);
  background: none;
  border-left: 0;
  border-right: 0;
  border-top: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  min-height: 56px;
}
.list .it:last-child { border-bottom: 0; }
.list .it .avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  flex: none;
}
.list .it .t { flex: 1; min-width: 0; }
.list .it .t b {
  display: block;
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list .it .t span {
  font-size: 12.5px;
  color: var(--muted);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.list .it .r { text-align: right; flex: none; }
.list .it .r b { display: block; font-size: 15px; font-weight: 750; }
.list .it .r span { font-size: 12px; color: var(--muted); }

.dayhd { font-size: 13px; font-weight: 750; color: var(--muted); padding: 14px 2px 4px; text-transform: uppercase; letter-spacing: 0.04em; }

/* Buttons */
.btn {
  min-height: 46px;
  border-radius: 12px;
  padding: 0 16px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14.5px;
}
.btn.pri { background: var(--helm); color: var(--helm-ink); border-color: transparent; }
.btn.ink { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.bad { color: var(--bad); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.iconbtn {
  min-width: 40px;
  min-height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  font-size: 18px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
}
.link { background: none; border: 0; color: var(--info); font-weight: 650; cursor: pointer; padding: 6px 0; }

/* Forms & Fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 650; color: var(--muted); }
.field input, .field select, .field textarea {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  padding: 10px 12px;
  width: 100%;
  font-size: 14.5px;
}
.field textarea { min-height: 80px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); font-size: 13.5px; font-weight: 650; min-height: 1.1em; }

/* Sheet Drawer Modal */
.sheet-bg {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 12, 0.45);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  z-index: 40;
  display: none;
}
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  display: none;
  justify-content: center;
}
.sheet .box {
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border-top: 1px solid var(--glass-line);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
}
.sheet.open, .sheet-bg.open { display: flex; }
.sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet.open .box { animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

/* Activity Feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li {
  display: flex;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  align-items: baseline;
}
.feed li:last-child { border-bottom: 0; }
.feed .d { width: 72px; flex: none; color: var(--muted); font-size: 12.5px; }
.feed .t { flex: 1; min-width: 0; }
.feed .a { font-variant-numeric: tabular-nums; font-weight: 750; white-space: nowrap; }
.in-c { color: var(--ok); }
.out-c { color: var(--ink); }
.void { text-decoration: line-through; opacity: 0.5; }

/* Toast */
.toast {
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: calc(14px + env(safe-area-inset-top, 0px));
  background: var(--ink);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 650;
  z-index: 50;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  display: none;
  max-width: calc(100% - 32px);
  white-space: nowrap;
}
.toast.show { display: block; }

/* Footer Watermark (Mandatory Link to zandev.id) */
.credit {
  text-align: center;
  font-size: 12.5px;
  color: var(--muted);
  padding: 28px 0 12px;
}
.credit a {
  color: var(--ink);
  text-decoration: none;
  font-weight: 750;
  transition: color 0.15s ease;
}
.credit a:hover { color: var(--helm); text-decoration: underline; }

/* Printable Kuitansi / Slip LPJ */
@media print {
  body { background: #fff !important; color: #000 !important; }
  header.top, nav.bottom, .credit, .sheet-bg, .no-print { display: none !important; }
  .sheet { position: static !important; display: block !important; }
  .sheet .box { max-height: none !important; border: 0 !important; background: #fff !important; padding: 0 !important; }
  .print-slip { border: 2px solid #000 !important; padding: 24px !important; margin: 10px 0 !important; }
}
</style>
</head>

<nav class="bottom" id="nav"></nav>

<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>

      <button class="iconbtn" onclick="closeSheet()" aria-label="Tutup" style="min-width:32px;min-height:32px;font-size:16px">✕</button>

    <div id="sheet-b"></div>
    <div class="err" id="sheet-e" style="margin-top:8px"></div>
    <div class="row" style="margin-top:16px;gap:10px">

      <button class="btn pri block" id="sheet-ok" style="flex:1">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* Formatting helpers */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtN = n => Number(n || 0).toLocaleString('id-ID');
const parseN = s => Number(String(s || '0').replace(/[^0-9]/g, '')) || 0;
const rp = n => 'Rp ' + fmtN(n);

const bigRp = n => {
  const s = fmtN(n);
  return '<span class="cur">Rp</span>' + s;
};

function rpWords(n) {
  n = Math.abs(Math.round(n || 0));
  if (n === 0) return 'Nol rupiah';
  const units = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  function terbilang(x) {
    if (x < 12) return units[x];
    if (x < 20) return terbilang(x - 10) + ' Belas';
    if (x < 100) return terbilang(Math.floor(x / 10)) + ' Puluh' + (x % 10 ? ' ' + terbilang(x % 10) : '');
    if (x < 200) return 'Seratus' + (x - 100 ? ' ' + terbilang(x - 100) : '');
    if (x < 1000) return terbilang(Math.floor(x / 100)) + ' Ratus' + (x % 100 ? ' ' + terbilang(x % 100) : '');
    if (x < 2000) return 'Seribu' + (x - 1000 ? ' ' + terbilang(x - 1000) : '');
    if (x < 1000000) return terbilang(Math.floor(x / 1000)) + ' Ribu' + (x % 1000 ? ' ' + terbilang(x % 1000) : '');
    if (x < 1000000000) return terbilang(Math.floor(x / 1000000)) + ' Juta' + (x % 1000000 ? ' ' + terbilang(x % 1000000) : '');
    return terbilang(Math.floor(x / 1000000000)) + ' Miliar' + (x % 1000000000 ? ' ' + terbilang(x % 1000000000) : '');
  }
  return terbilang(n) + ' Rupiah';
}

function fd(iso) {
  if (!iso) return '—';
  const parts = String(iso).slice(0, 10).split('-');
  if (parts.length < 3) return iso;
  const m = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return parts[2] + ' ' + m[Number(parts[1]) - 1] + ' ' + parts[0];
}

function fdl(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  return days[d.getDay()] + ', ' + fd(iso);
}

function today() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

/* Project getters */
const P = () => S.projects.find(p => p.id === S.activeId) || S.projects[0];
const workersOf = pid => S.workers.filter(w => w.pid === pid);
const txnsOf = pid => S.txns.filter(t => t.pid === pid && !t.void);
const payrollsOf = pid => S.payrolls.filter(p => p.pid === pid);

function kasSaldo(pid) {
  const p = P();
  const tx = txnsOf(pid);
  const masuk = tx.filter(t => t.dir === 'in').reduce((s, t) => s + t.amount, 0);
  const keluar = tx.filter(t => t.dir === 'out').reduce((s, t) => s + t.amount, 0);
  const honorKeluar = payrollsOf(pid).reduce((s, p) => s + p.netto, 0);
  // Txns might already record honor, so check if honor is already in txns:
  const txHonor = tx.filter(t => t.dir === 'out' && t.cat === 'honor').reduce((s, t) => s + t.amount, 0);
  return (p.saldo || 0) + masuk - keluar - (honorKeluar > txHonor ? (honorKeluar - txHonor) : 0);
}

function totalRealisasi(pid) {
  const tx = txnsOf(pid);
  const belanja = tx.filter(t => t.dir === 'out' && t.cat !== 'honor').reduce((s, t) => s + t.amount, 0);
  const honorNetto = payrollsOf(pid).reduce((s, p) => s + p.netto, 0);
  const honorPajak = payrollsOf(pid).reduce((s, p) => s + p.tax_amt, 0);
  return belanja + honorNetto + honorPajak;
}

function totalPajak(pid) {
  const p = payrollsOf(pid);
  const pph21 = p.reduce((s, x) => s + (x.tax_amt || 0), 0);
  const tx = txnsOf(pid);
  const pph22 = tx.reduce((s, x) => s + (x.tax_pph22 || 0), 0);
  const pph23 = tx.reduce((s, x) => s + (x.tax_pph23 || 0), 0);
  const ppn = tx.reduce((s, x) => s + (x.tax_ppn || 0), 0);
  return { pph21, pph22, pph23, ppn, total: pph21 + pph22 + pph23 + ppn };
}

function feedHTML(pid) {
  const ev = [];
  txnsOf(pid).forEach(t => {
    ev.push({
      d: t.date,
      ts: t.ts,
      txt: (t.dir === 'in' ? 'Masuk: ' : 'Keluar: ') + (t.note || t.cat),
      amt: (t.dir === 'in' ? 1 : -1) * t.amount
    });
  });
  payrollsOf(pid).forEach(p => {
    const w = S.workers.find(x => x.id === p.wid);
    ev.push({
      d: p.date,
      ts: p.ts,
      txt: 'Honor: ' + (w ? w.name : 'Personel') + ' (' + p.period + ')',
      amt: -p.netto
    });
  });
  ev.sort((a, b) => b.d.localeCompare(a.d) || (b.ts || 0) - (a.ts || 0));
  if (!ev.length) return '<p class="muted small" style="padding:10px 0">Belum ada transaksi dicatat.</p>';
  return '<ul class="feed">' +
    ev.slice(0, 6).map(e =>
      '<li>' +
        '<span class="d">' + fd(e.d) + '</span>' +
        '<span class="t">' + esc(e.txt) + '</span>' +
        '<span class="a ' + (e.amt > 0 ? 'in-c' : 'out-c') + '">' + (e.amt > 0 ? '+' : '−') + rp(Math.abs(e.amt)).replace('Rp ', '') + '</span>' +
      '</li>'
    ).join('') +
  '</ul>';
}

function vKas() {

function calcHonorTax() {
  const wid = $('#fh-wid')?.value;
  const w = S.workers.find(x => x.id === wid);
  const grossInp = $('#fh-gross');
  if (w && (!grossInp.value || grossInp.value === '0')) {
    grossInp.value = fmtN(w.tarif || 0);
  }
  const gross = parseN(grossInp?.value || '0');
  const g = GOL_RULES[w ? w.golongan : 'non_pns_npwp'] || GOL_RULES['non_pns_npwp'];
  const tax = Math.round(gross * g.rate);
  const net = gross - tax;

  if ($('#fh-rate-label')) $('#fh-rate-label').textContent = (g.rate * 100).toFixed(1) + '% (' + g.label.split('(')[0].trim() + ')';
  if ($('#fh-tax')) $('#fh-tax').textContent = '− ' + rpC(tax);
  if ($('#fh-netto')) $('#fh-netto').textContent = rpC(net);
}

          ref,
          gross,
          tax_rate: g.rate,
          tax_amt,
          netto,
          note,
          paid: true
        });

        S.txns.push({
          id: uid(),
          pid: p.id,
          date,
          ts: Date.now() + idx,

          amount: netto,
          gross,
          tax_pph21: tax_amt,
          tax_pph22: 0,

          void: false
        });

      closeSheet();

      render();
    }
  );

  saveState();
  closeSheet();
  toast(pay.approved ? 'Kuitansi telah disetujui & disahkan Ketua' : 'Persetujuan kuitansi dibatalkan');
  render();
  setTimeout(() => sheetSlipDetail(payId), 200);
}

function deletePayroll(id) {
  if (!confirm('Yakin ingin membatalkan slip honor ini? Transaksi kas terkait juga akan dihapus.')) return;
  const pay = S.payrolls.find(p => p.id === id);
  if (pay) {
    S.txns = S.txns.filter(t => t.ref !== pay.ref);
  }
  S.payrolls = S.payrolls.filter(p => p.id !== id);
  saveState();
  closeSheet();
  toast('Slip honor dibatalkan');
  render();
}

function exportCoretaxCSV() {
  const pays = payrollsOf(P().id);
  let csv = 'Kode Pajak,Nama Penerima,NIK (16 Digit),NPWP,Bruto,Tarif Pajak,Potongan PPh 21,Tanggal,No Bukti Potong\n';
  pays.forEach(pay => {
    const w = S.workers.find(x => x.id === pay.wid);
    csv += [
      '21-100-01',
      '"' + (w ? w.name : '') + '"',
      w ? w.nik : '',
      w ? w.npwp : '',
      pay.gross,
      (pay.tax_rate * 100).toFixed(1) + '%',
      pay.tax_amt,
      pay.date,
      pay.ref
    ].join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Coretax_DJP_PPh21_' + today() + '.csv';
  a.click();
  toast('File CSV Coretax siap diimpor ke e-Bupot');
}

            '<option value="' + k + '" ' + (r.badgeClass === k ? 'selected' : '') + '>' + l + '</option>'
          ).join('') +

      ) +

      fld('Deskripsi Tanggung Jawab', '<textarea id="f-role-desc" placeholder="Tugas utama peran ini dalam riset...">' + esc(r.desc || '') + '</textarea>') +

      '<div class="card" style="background:var(--panel2)">' +

        ).join('') +
      '</div>' +

      (!isNew && !r.system ?
        '<button type="button" class="btn bad block" style="margin-top:8px" onclick="deleteRole(\'' + r.id + '\')">Hapus Peran Ini</button>' : '') +
    '</div>',

      const idInp = $('#f-role-id').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
      const name = $('#f-role-name').value.trim();
      const tag = $('#f-role-tag').value.trim() || name;
      const icon = $('#f-role-icon').value || '📋';
      const badgeClass = $('#f-role-badge').value;
      const desc = $('#f-role-desc').value.trim();

      if (!idInp) { $('#sheet-e').textContent = 'ID Peran wajib diisi.'; return; }
      if (!name) { $('#sheet-e').textContent = 'Nama Peran wajib diisi.'; return; }

      const perms = {};
      $('.perm-chk').forEach(chk => {
        perms[chk.dataset.k] = chk.checked;
      });

      // Update S.roles
      S.roles = S.roles || getRoles().slice();
      const idx = S.roles.findIndex(x => x.id === (isNew ? idInp : r.id));
      const roleObj = {
        id: isNew ? idInp : r.id,
        name,
        tag,
        icon,
        badgeClass,
        desc,
        perms,
        system: Boolean(r.system)
      };

      if (idx >= 0) {
        S.roles[idx] = roleObj;
      } else {
        S.roles.push(roleObj);
      }
      saveState();

      // Sync to server if online
      try {
        await fetch('/api/roles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(roleObj)
        });
      } catch (e) {}

      closeSheet();
      toast(isNew ? 'Peran baru berhasil ditambahkan' : 'Peran diperbarui');
      render();
    }
  );
}

function selectRoleEmoji(em) {
  const hiddenInp = $('#f-role-icon');
  if (hiddenInp) hiddenInp.value = em;
  $('[id^="em-"]').forEach(btn => {
    btn.style.background = '';
    btn.style.color = '';
  });
  const selectedBtn = $('#em-' + em);
  if (selectedBtn) {
    selectedBtn.style.background = 'var(--ink)';
    selectedBtn.style.color = 'var(--bg)';
  }
}

async function deleteRole(roleId) {
  if (!confirm('Yakin ingin menghapus peran ini?')) return;
  S.roles = (S.roles || getRoles()).filter(x => x.id !== roleId);
  saveState();
  if (CURRENT_ROLE === roleId) {
    selectRole('bendahara');
  }
  try {
    await fetch('/api/roles', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: roleId })
    });
  } catch (e) {}
  closeSheet();
  toast('Peran dihapus');
  render();
}

function exportBKU() {
  const p = P();
  const tx = txnsOf(p.id).sort((a, b) => a.date.localeCompare(b.date));
  let saldo = p.saldo || 0;

  const rows = [
    ['BUKU KAS UMUM (BKU) PENELITIAN'],
    ['Judul Penelitian: ' + p.name],
    ['Ketua Peneliti: ' + p.leader],
    ['Tahun Anggaran: ' + p.year],
    [],
    ['No', 'Tanggal', 'No Bukti', 'Kategori', 'Keterangan', 'Penerimaan (Rp)', 'Pengeluaran (Rp)', 'Saldo (Rp)']
  ];

  tx.forEach((t, i) => {
    const deb = t.dir === 'in' ? t.amount : 0;
    const krd = t.dir === 'out' ? t.amount : 0;
    saldo += deb - krd;
    rows.push([
      i + 1,
      t.date,
      t.ref || '',
      CAT_IN[t.cat] || CAT_OUT[t.cat] || t.cat,
      t.note || '',
      deb,
      krd,
      saldo
    ]);
  });

  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'BKU');
    XLSX.writeFile(wb, 'BKU_Penelitian_' + p.year + '.xlsx');
    toast('File Excel BKU berhasil diunduh');
  } else {
    alert('Modul Excel belum selesai dimuat, coba sesaat lagi.');
  }
}

function exportRealisasi() {
  const p = P();
  const tx = txnsOf(p.id);

  const pos = {
    honor: { name: 'Honorarium Tim & Pembantu Peneliti', real: 0 },
    bahan: { name: 'Bahan Habis Pakai / ATK Lab', real: 0 },
    alat: { name: 'Sewa & Pengadaan Alat', real: 0 },
    perjalanan: { name: 'Perjalanan & Transportasi Lapang', real: 0 },
    publikasi: { name: 'Publikasi Jurnal & Prosiding', real: 0 },
    ops: { name: 'Operasional & FGD', real: 0 }
  };

  tx.filter(t => t.dir === 'out').forEach(t => {
    if (pos[t.cat]) pos[t.cat].real += t.amount;
  });

  const rows = [
    ['LAPORAN REALISASI ANGGARAN PENELITIAN'],
    ['Judul: ' + p.name],
    ['Ketua: ' + p.leader],
    ['Total Pagu: Rp ' + fmtN(p.pagu)],
    [],
    ['No', 'Pos Pengeluaran', 'Realisasi (Rp)']
  ];

  let total = 0;
  Object.values(pos).forEach((item, idx) => {
    rows.push([idx + 1, item.name, item.real]);
    total += item.real;
  });
  rows.push(['', 'TOTAL REALISASI', total]);
  rows.push(['', 'SISA DANA PAGU', p.pagu - total]);

  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Realisasi');
    XLSX.writeFile(wb, 'Realisasi_Anggaran_' + p.year + '.xlsx');
    toast('Laporan realisasi berhasil diunduh');
  } else {
    alert('Modul Excel sedang disiapkan.');
  }
}

function exportPajakExcel() {
  exportCoretaxCSV();
}

/* Sub-View: Akun & Sinkronisasi */
function vAkun() {
  return '<div class="stack">' +
    backBar('Akun Saya &amp; Sinkronisasi') +
    '<div class="card">' +
      '<div class="lab">Masuk Sebagai</div>' +
      '<div class="val">' + esc(ME ? ME.name : 'Tamu / Offline') + '</div>' +
      '<div class="sub">Username: <b>@' + esc(ME ? ME.username : 'local') + '</b> · Peran: <b>' + (ME ? (ROLE_L[ME.role] || ME.role) : 'Super Admin (Lokal)') + '</b></div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="row between">' +
        '<span class="lab">Status Server</span>' +
        '<span class="pill ' + (MODE === 'server' ? 'ok' : 'warning') + '">' +
          '<span class="dot"></span> ' + (MODE === 'server' ? 'Terhubung (Server VPS)' : 'Mode Lokal (Browser)') +
        '</span>' +
      '</div>' +
      '<p class="small muted" style="margin:8px 0 0">Server fintax.zandev.id otomatis menyimpan perubahan data ke database SQLite pusat.</p>' +
    '</div>' +

    (ME ? '<button class="btn bad block" onclick="doLogout()">Keluar dari Akun</button>' : '<button class="btn pri block" onclick="sheetLogin()">Masuk Akun Server</button>') +
  '</div>';
}

function sheetLogin() {
  sheet('Masuk Akun Server',
    '<div class="stack">' +
      fld('Username', '<input id="fl-uname" placeholder="admin / bendahara">') +
      fld('Password', '<input type="password" id="fl-pass" placeholder="••••••••">') +
    '</div>',
    'Masuk',
    async () => {
      const uname = $('#fl-uname').value.trim();
      const pass = $('#fl-pass').value.trim();
      if (!uname || !pass) { $('#sheet-e').textContent = 'Masukkan username & password.'; return; }
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: uname, password: pass })
        });
        const res = await r.json();
        if (r.ok && res.user) {
          ME = res.user;
          MODE = 'server';
          closeSheet();
          toast('Berhasil login sebagai ' + ME.name);
          loadUsers();
          render();
        } else {
          $('#sheet-e').textContent = res.error || 'Login gagal.';
        }
      } catch (err) {
        $('#sheet-e').textContent = 'Koneksi error: ' + err.message;
      }
    }
  );
}

async function doLogout() {
  if (!confirm('Keluar dari akun?')) return;
  try {
    await fetch('/api/logout', { method: 'POST' });
  } catch (e) {}
  ME = null;
  MODE = 'local';
  toast('Telah keluar');
  render();
}

/* ==========================================================================
   NAVIGATION & SHELL RENDERING
   ========================================================================== */
function go(v, s = null) {
  if (v) {
    view = v;
    sub = null;
  }
  if (s !== undefined) {
    sub = s;
    if (s) subFrom = view;
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
  render();
}

function renderHeader() {
  const p = P();
  const topEl = $('#top');
  if (!topEl) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = ROLES[CURRENT_ROLE] || ROLES.bendahara;

  topEl.innerHTML =
    '<button class="projbtn" onclick="go(null, \'proyek\')">' +
      '<b>' + esc(p.name) + '</b>' +
      '<span>' + esc(p.scheme || 'Riset Kemendikbudristek') + ' · ' + p.year + '</span>' +
    '</button>' +
    '<button class="pill ' + r.badgeClass + '" onclick="sheetSwitchRole()" aria-label="Ganti Peran" title="Klik untuk ganti peran: Admin, Ketua, Bendahara">' +
      '<span>' + r.icon + '</span> <b>' + r.tag + '</b>' +
    '</button>' +
    '<button class="iconbtn" onclick="toggleTheme()" aria-label="Ganti Tema" style="min-width:36px;min-height:36px">' +
      svg(isDark ? 'sun' : 'moon') +
    '</button>';
}

function sheetSwitchRole() {
  const cur = getRole(CURRENT_ROLE);
  sheet('Akun & Peran Aktif',
    '<div class="stack">' +
      '<div class="card" style="background:var(--panel2)">' +
        '<div class="lab">Akun Terautentikasi</div>' +
        '<div class="row" style="margin-top:6px;gap:10px">' +
          '<span style="font-size:28px">' + (cur.icon || '💼') + '</span>' +
          '<div>' +
            '<b style="font-size:16.5px">' + esc(ME?.name || cur.name) + '</b>' +
            '<div class="small muted">@' + esc(ME?.username || 'user') + ' · <span class="pill ' + (cur.badgeClass || 'ok') + '" style="font-size:10.5px;padding:1px 7px">' + esc(cur.name) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="small muted" style="margin-top:8px">' + esc(cur.desc) + '</div>' +
      '</div>' +

      '<div class="card stack" style="gap:8px">' +
        '<h3>Ganti Peran / Akun Lain</h3>' +
        '<p class="small muted" style="margin:0">Untuk keamanan dan integritas keuangan riset, pergantian akun wajib memasukkan password yang valid.</p>' +
        '<button class="btn pri block" onclick="sheetSwitchAccount()">Ganti Akun (Login)</button>' +
      '</div>' +

      (canAdmin() ?
        '<button class="btn block" onclick="closeSheet();go(null, \'roles\')">🎭 Kelola Peran &amp; Hak Akses</button>' : '') +

      '<button class="btn bad block" onclick="closeSheet();doLogout()">Keluar (Logout)</button>' +
    '</div>',
    'Tutup',
    () => closeSheet()
  );
}

function sheetSwitchAccount() {
  closeSheet();
  sheet('Masuk Akun Lain',
    '<div class="stack">' +
      fld('Username Akun', '<input id="sw-u" autocomplete="username" placeholder="admin / ketua / bendahara">') +
      fld('Password', '<input type="password" id="sw-p" autocomplete="current-password" placeholder="••••••••">') +
      '<div class="card" style="background:var(--panel2);padding:10px 12px;font-size:12px">' +
        '<b>Akun Bawaan Sistem:</b><br>' +
        '• <code>admin</code>: Super Admin (semua proyek &amp; kelola user)<br>' +
        '• <code>ketua</code>: Ketua Peneliti (approval &amp; tanda tangan LPJ)<br>' +
        '• <code>bendahara</code>: Bendahara (catat kas, honor &amp; pajak Coretax)' +
      '</div>' +
    '</div>',
    'Masuk',
    async () => {
      const u = $('#sw-u')?.value.trim();
      const pw = $('#sw-p')?.value || '';
      if (!u || !pw) {
        $('#sheet-e').textContent = 'Masukkan username & password.';
        return;
      }
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: pw })
        });
        const res = await r.json();
        if (r.ok && res.user) {
          ME = res.user;
          CURRENT_ROLE = ME.role;
          closeSheet();
          toast('Berhasil masuk sebagai ' + ME.name + ' (' + (ROLE_L[ME.role] || ME.role) + ')');
          loadUsers();
          loadServerRoles();
          render();
        } else {
          $('#sheet-e').textContent = res.error || 'Password salah.';
        }
      } catch (err) {
        $('#sheet-e').textContent = 'Error: ' + err.message;
      }
    }
  );
}

function renderNav() {
  const navEl = $('#nav');
  if (!navEl) return;
  navEl.innerHTML =
    '<div class="in">' +
      NAV_TABS.map(([k, label]) => {
        const isCurrent = !sub && view === k;
        return '<button onclick="go(\'' + k + '\', null)" ' + (isCurrent ? 'aria-current="page"' : '') + '>' +
          svg(k) +
          '<span>' + label + '</span>' +
        '</button>';
      }).join('') +
    '</div>';
}

function render() {
  if (!ME) {
    const topEl = $('#top');
    if (topEl) {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      topEl.innerHTML =
        '<div style="font-weight:800;font-size:18px">🏛️ Zan<span style="color:var(--helm)">Fin</span></div>' +
        '<div style="flex:1"></div>' +
        '<button class="iconbtn" onclick="toggleTheme()" aria-label="Ganti Tema" style="min-width:36px;min-height:36px">' +
          svg(isDark ? 'sun' : 'moon') +
        '</button>';
    }
    const navEl = $('#nav');
    if (navEl) navEl.innerHTML = '';
    const viewEl = $('#view');
    if (viewEl) viewEl.innerHTML = vLogin();
    return;
  }

  renderHeader();
  renderNav();
  const viewEl = $('#view');
  if (!viewEl) return;

  if (view === 'nadi') viewEl.innerHTML = vNadi();
  else if (view === 'kas') viewEl.innerHTML = vKas();
  else if (view === 'tim') viewEl.innerHTML = vTim();
  else if (view === 'honor') viewEl.innerHTML = vHonor();
  else if (view === 'lainnya') viewEl.innerHTML = vLainnya();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  renderHeader();
}

async function init() {
  view = 'nadi';
  sub = null;

  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }

  loadState();

  try {
    const r = await fetch('/api/me');
    if (r.ok) {
      const data = await r.json();
      ME = data.user;
      MODE = 'server';
      loadUsers();
    }
  } catch (e) {
    MODE = 'local';
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
  }

  loadServerRoles();
  render();
}

window.addEventListener('DOMContentLoaded', init);
</script>
