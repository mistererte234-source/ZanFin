# Nginx configuration for fintax.zandev.id
# Put in /etc/nginx/sites-available/fintax.zandev.id
# symlink: ln -s /etc/nginx/sites-available/fintax.zandev.id /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name fintax.zandev.id;

    # Redirect all HTTP to HTTPS (uncomment after running certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Max upload size for attachments (SPJ receipts, PDF scans)
        client_max_body_size 50M;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
